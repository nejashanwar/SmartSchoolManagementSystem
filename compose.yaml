services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    env_file:
      - .env
    environment:
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DOCKER_DB_DATABASE:-SmartSchoolManagementSystem}
      DB_USERNAME: ${DOCKER_DB_USERNAME:-smartschool}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-smartschool-local}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage/app
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-SmartSchoolManagementSystem}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-smartschool}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-smartschool-local}
      MYSQL_ROOT_PASSWORD: ${DOCKER_MYSQL_ROOT_PASSWORD:-smartschool-root-local}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  app-storage:
  mysql-data:
